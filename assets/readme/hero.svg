<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">carouselify</title>
  <desc id="desc">Create design-consistent LinkedIn carousels in minutes with a visual editor, customizable themes, and export to PNG or PDF.</desc>

  <defs>
    <rect id="canvas-bg" width="1080" height="1080" rx="8" fill="#EAF0F6"/>
    <rect id="canvas-accent" width="1080" height="8" rx="4" fill="#0284c7"/>
  </defs>

  <rect width="1200" height="360" fill="#ffffff"/>

  <g id="title-block" transform="translate(56 48)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="48" font-weight="900" fill="#0D1B2A">carouselify</text>
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#475569">Design-consistent LinkedIn carousels in minutes.</text>

    <g id="color-swatches" transform="translate(0 52)">
      <rect x="0" y="0" width="24" height="24" rx="4" fill="#EAF0F6" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="30" y="0" width="24" height="24" rx="4" fill="#EDEAE3" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="60" y="0" width="24" height="24" rx="4" fill="#EDF2EE" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="90" y="0" width="24" height="24" rx="4" fill="#FFFBEC" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="120" y="0" width="24" height="24" rx="4" fill="#FFF0F5" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="150" y="0" width="24" height="24" rx="4" fill="#EDFFF8" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="180" y="0" width="24" height="24" rx="4" fill="#F4F0FF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="210" y="0" width="24" height="24" rx="4" fill="#FFF4EE" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="240" y="0" width="24" height="24" rx="4" fill="#EEF6FF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">10 color schemes</text>
    </g>
  </g>

  <g id="canvas-proof" transform="translate(620 36)">
    <rect x="0" y="0" width="240" height="240" rx="6" fill="#EAF0F6" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="24" y="24" width="192" height="192" rx="2" fill="#ffffff"/>
    <rect x="24" y="24" width="192" height="8" rx="2" fill="#0284c7"/>
    <text x="120" y="100" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0D1B2A" text-anchor="middle">Your headline</text>
    <text x="120" y="130" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Supporting text goes here</text>
    <rect x="24" y="216" width="192" height="4" rx="2" fill="#0284c7"/>
    <text x="120" y="238" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">1 / 3</text>

    <g id="font-specimens" transform="translate(0 256)">
      <text x="0" y="0" font-family="Georgia, serif" font-size="11" fill="#0D1B2A">Fraunces / DM Sans</text>
      <text x="0" y="14" font-family="Georgia, serif" font-size="11" fill="#0D1B2A">Playfair Display / Inter</text>
      <text x="0" y="28" font-family="Georgia, serif" font-size="11" fill="#0D1B2A">Bitter / Nunito Sans</text>
      <text x="0" y="42" font-family="Georgia, serif" font-size="11" fill="#0D1B2A">Fredoka / Lexend Deca</text>
      <text x="0" y="56" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" fill="#94A3B8">4 pairings + 56 custom fonts (premium)</text>
    </g>
  </g>
</svg>